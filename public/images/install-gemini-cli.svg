<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" rx="42" fill="#F0F5EA"/>
  <rect x="56" y="56" width="1088" height="788" rx="34" fill="#FFFDF7" stroke="#243444" stroke-width="8"/>
  <rect x="96" y="96" width="390" height="86" rx="18" fill="#FFF2B8" stroke="#243444" stroke-width="6"/>
  <text x="124" y="150" fill="#183153" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="42" font-weight="700">Step 2 / 安裝 Gemini CLI</text>
  <rect x="104" y="266" width="992" height="182" rx="28" fill="#172A3D"/>
  <text x="136" y="350" fill="#F6F9FF" font-family="Consolas, monospace" font-size="34">npm install -g @google/gemini-cli</text>
  <text x="136" y="404" fill="#9FD0FF" font-family="Consolas, monospace" font-size="22">global install</text>
  <text x="104" y="548" fill="#183153" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="700">第一次安裝只做一次</text>
  <text x="104" y="604" fill="#506174" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28">安裝完成後，之後在任何專案資料夾都能直接輸入 gemini。</text>
  <rect x="828" y="560" width="220" height="124" rx="24" fill="#DDF4CF" stroke="#243444" stroke-width="6"/>
  <text x="872" y="632" fill="#183153" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="46" font-weight="700">CLI</text>
</svg>
